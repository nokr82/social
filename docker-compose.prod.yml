# 운영 서버 전용: docker-compose.yml 위에 덮어씀
# (서버의 .env에서 COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml 로 합쳐 사용)
services:
  mariadb:
    # 2GB 서버용 메모리 상한
    command: --innodb-buffer-pool-size=256M --max-connections=50 --performance-schema=OFF

  php:
    volumes:
      # 개발용 php.ini(오류 화면 표시) 위에 운영 값을 덮어씀: 오류 숨김·opcache 고정
      # (deploy.sh가 배포 때마다 PHP-FPM을 USR2로 리로드하므로 opcache가 새 코드로 갱신됨)
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
