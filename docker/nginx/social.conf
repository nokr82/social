# 호스트 Nginx용 설정 → /etc/nginx/sites-available/social.conf 로 복사
server {
    listen 80;
    server_name social.local;

    # 정적 파일은 호스트 경로에서 직접 서빙
    root /mnt/hgfs/dev_test/social/api/public;
    index index.php;

    client_max_body_size 25M;

    # Reverb 웹소켓 (/app/{key}) 과 이벤트 API (/apps/...) → reverb 컨테이너
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # 웹소켓 업그레이드
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;                  # 유휴 연결 끊김 방지
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9002;
        include fastcgi_params;
        # 주의: PHP 컨테이너 안의 경로를 넘겨야 함 (호스트 경로 아님)
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
