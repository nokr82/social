; 운영 서버 전용 (docker-compose.prod.yml이 php 컨테이너에만 붙임)
; zz-custom.ini(개발) 다음에 읽혀서 같은 항목을 덮어쓴다
expose_php = Off
memory_limit = 256M

; 오류는 화면 대신 로그로 (내부 경로·쿼리 노출 방지)
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; 배포 = git pull + FPM 리로드(USR2) → 요청마다 파일 변경 검사 불필요
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

session.cookie_secure = 1
session.cookie_httponly = 1
